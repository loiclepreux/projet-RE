<main class="score-container">
    <!-- MES SCORES -->
    <section class="user-score">
        <h1>Vos scores</h1>
        <div id="my-scores" class="score-info">
            <!-- rempli par le JavaScript -->
        </div>
    </section>

    <!-- CLASSEMENT MONDIAL -->
    <section class="leaderboard">
        <h2>Classement mondial</h2>

        <div class="score-tabs">
            <button type="button" data-difficulty="facile" class="active">
                Facile
            </button>
            <button type="button" data-difficulty="moyen">Moyen</button>
            <button type="button" data-difficulty="difficile">Difficile</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Pseudo</th>
                    <th>Meilleur score</th>
                    <th>Parties</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- rempli par le JavaScript -->
            </tbody>
        </table>
    </section>
</main>
